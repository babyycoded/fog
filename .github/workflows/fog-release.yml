name: Fog release

# Builds the Fog client for Linux and Windows and attaches the archives to a GitHub release.
# Push a tag like v1.0.0-beta, or start it by hand with a tag name.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0-beta)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux
          os: ubuntu-22.04
          cmake-args: -G Ninja
          package-file: '*-linux_x86_64.tar.xz'
          out: linux_x86_64.tar.xz
        - name: windows
          os: windows-latest
          cmake-args: -A x64
          package-file: '*-win64.zip'
          out: win64.zip
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Prepare Linux
      if: matrix.name == 'linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake ninja-build pkg-config libavcodec-dev libavformat-dev libavutil-dev \
          libfreetype6-dev libglew-dev libnotify-dev libpng-dev libsdl2-dev libsqlite3-dev libswresample-dev \
          libswscale-dev libx264-dev libcurl4-openssl-dev libssl-dev libdbus-1-dev libturbojpeg0-dev

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Build
      shell: bash
      run: |
        mkdir release && cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target game-client
        cmake --build . --config Release --target package_default

    - name: Rename package
      shell: bash
      run: |
        cd release
        mkdir -p ../out
        mv ${{ matrix.package-file }} "../out/Fog-${TAG#v}-${{ matrix.out }}"
        ls -la ../out

    - uses: actions/upload-artifact@v6
      with:
        name: fog-${{ matrix.name }}
        path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: out
        merge-multiple: true
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ls -la out
        gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
          --title "Fog ${TAG#v}" \
          --notes "Fog ${TAG#v}: public beta of the Fog client for DDNet.

        Linux: unpack the .tar.xz and run DDNet. Windows: unpack the .zip and run DDNet.exe.

        Third-party client, not affiliated with DDNet. Public beta: expect bugs. Play fair."
