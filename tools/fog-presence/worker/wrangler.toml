# Fog presence server as a Cloudflare Worker: free *.workers.dev address, always on.
# Deploy: npx wrangler login && npx wrangler deploy
name = "fog-presence"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

# the free plan needs SQLite-backed Durable Objects; the state itself stays in memory
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]
